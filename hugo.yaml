# Hugo configuration file
title: 머니다이어리 블로그
baseURL: "https://moneydiary.co.kr"
languageCode: ko-kr
defaultContentLanguage: ko

# Hugo 버전 요구사항
module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra
      version: v0.11.1

# 큰 파일들 무시 (Cloudflare Pages 25MB 제한 대응)
ignoreFiles:
  - "\\.pdf$"
  - "\\.zip$"
  - "\\.rar$"

# 마크업 설정
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      wikilink:
        enable: true
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true
    parser:
      wikiLinks: true
  highlight:
    noClasses: false

# 퍼머링크 설정
permalinks:
  산업-테마공부: "/industry-study/:slug/"
  기업공부: "/company-analysis/:slug/"
  Daily시황정리: "/daily-summary/:year/:month/:slug/"
  earning: "/earnings/:slug/"
  투자아이디어: "/investment-ideas/:slug/"

# 인라인 shortcode 활성화
enableInlineShortcodes: true

# 분류 체계
taxonomies:
  category: categories
  tag: tags

enableRobotsTXT: true

# 구글 애널리틱스
services:
  googleAnalytics:
    ID: G-NGGXTL53D1

# 출력 형식
outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]

# 각 섹션의 모든 페이지에 기본 프론트매터 적용
_merge:
  - content:
      _target:
        kind: ['page']
        path: ['Daily시황정리', '산업-테마공부', '기업공부', 'earning', '투자아이디어']
      type: 'docs'
      sidebar:
        open: true

# Hextra 테마 파라미터
params:
  description: "오늘을 기록하고 내일의 투자를 준비하는 블로그, 머니다이어리(Moneydiary)"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # 검색 기능 비활성화
  search:
    enable: false

  editURL:
    enable: true
    base: "https://github.com/oming1/moneydiaryblog/edit/main/content"

  page:
    width: normal

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

# 메뉴 설정
menu:
  main:
    - name: Daily시황정리
      pageRef: /daily시황정리
      weight: 1
    - name: 산업-테마공부
      pageRef: /산업-테마공부
      weight: 2
    - name: 기업공부
      pageRef: /기업공부
      weight: 3
    - name: Earning
      pageRef: /earning
      weight: 4
    - name: 투자아이디어
      pageRef: /투자아이디어
      weight: 5
    - name: 소개
      pageRef: /about
      weight: 6
    - name: 검색
      weight: 7
      params:
        type: search
    - name: Telegram
      weight: 8
      url: "https://t.me/moneydiary_ko"
      params:
        icon: x-twitter
    - name: Language Switcher
      weight: 9

